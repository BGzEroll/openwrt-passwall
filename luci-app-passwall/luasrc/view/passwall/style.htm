<style>
#cbi-passwall .passwall-value-text { display:inline-block; padding-top:6px; line-height:18px; }
#cbi-passwall .cbi-value-field > br,
#cbi-passwall .cbi-value > br { display:none; }
#cbi-passwall .cbi-value-description { display:block; position:relative; margin:0.25em 0 0; padding-inline-start:1.25em; }
#cbi-passwall .cbi-value-description:not(:empty)::before { left:0; margin-right:0; }
#cbi-passwall .cbi-value-field input[type="checkbox"] { margin-inline-end:0.35em; }
#cbi-passwall .cbi-value-field > input,
#cbi-passwall .cbi-value-field > select,
#cbi-passwall .cbi-value-field > textarea { margin-bottom:0; }
#cbi-passwall .cbi-value-field > .cbi-checkbox {
	display:flex; width:max-content; height:auto; min-height:0; margin-top:0.5em;
}
#cbi-passwall .passwall-rule-lazy-list { display:block; width:100%; min-width:0; }
#cbi-passwall .passwall-rule-lazy-list > div { width:100%; min-width:0; }
#cbi-passwall .passwall-rule-lazy-list textarea {
	display:block; box-sizing:border-box; width:100%; max-width:none;
}
</style>
<script type="text/javascript">
(function() {
	[['.cbi-button-up', '上移'], ['.cbi-button-down', '下移']].forEach(function(item) {
		document.querySelectorAll('#cbi-passwall ' + item[0]).forEach(function(button) {
			button.value = item[1];
			button.title = item[1];
		});
	});
})();
</script>
