<% local api = require "luci.passwall.api" -%>
<fieldset class="cbi-section" id="passwall-status">
	<legend><%:运行状态%></legend>
	<div class="passwall-status-grid">
		<% for _, name in ipairs({"TCP", "UDP", "DNS"}) do %>
		<div class="passwall-status-card">
			<div class="passwall-status-icon passwall-status-<%=name:lower()%>" aria-hidden="true">
				<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
				<% if name == "TCP" then %>
					<path d="M4 7h16m-5-5 5 5-5 5M20 17H4m5-5-5 5 5 5" />
				<% elseif name == "UDP" then %>
					<path d="m21 3-7 18-4-8-8-4 19-6ZM10 13 21 3" />
				<% else %>
					<circle cx="12" cy="12" r="9" /><ellipse cx="12" cy="12" rx="4" ry="9" /><path d="M3 12h18M5 6h14M5 18h14" />
				<% end %>
				</svg>
			</div>
			<div><strong><%=name%></strong><br /><span id="status_<%=name:lower()%>">—</span></div>
		</div>
		<% end %>
	</div>
</fieldset>
<style>
#passwall-status .passwall-status-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:1rem; }
#passwall-status .passwall-status-card {
	display:flex; align-items:center; gap:1rem; padding:1rem;
	border:1px solid rgba(127,127,127,0.15); border-radius:0.375rem;
	box-shadow:0 0 1.5rem rgba(127,127,127,0.1);
}
#passwall-status .passwall-status-icon {
	display:flex; align-items:center; justify-content:center;
	flex:0 0 44px; height:44px; border-radius:50%; color:#fff;
}
#passwall-status .passwall-status-tcp { background:#2eb8ce; }
#passwall-status .passwall-status-udp { background:#f7ad39; }
#passwall-status .passwall-status-dns { background:#2f98e8; }
#passwall-status [data-state="running"],
#passwall-status [data-state="configured"] { color:#28a745; }
#passwall-status [data-state="not_running"] { color:#c00; }
@media (max-width:600px) {
	#passwall-status .passwall-status-grid { grid-template-columns:1fr; gap:0.5rem; }
}
</style>
<script type="text/javascript">
(function() {
	var labels = {running:'运行中', configured:'运行中', not_running:'未运行', disabled:'已关闭'};
	XHR.poll(5, '<%=api.url("index_status")%>', null, function(x, data) {
		['tcp', 'udp', 'dns'].forEach(function(name) {
			var element = document.getElementById('status_' + name);
			var state = x && x.status === 200 && data ? data[name + '_status'] : '';
			element.textContent = state ? (labels[state] || '未知') : '读取失败';
			element.setAttribute('data-state', state);
		});
	});
})();
</script>
