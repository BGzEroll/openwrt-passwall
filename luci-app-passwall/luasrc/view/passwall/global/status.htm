<%
local api = require "luci.passwall.api"
-%>

<style>
	.status-grid {
		display: grid;
		grid-template-columns: repeat(3, minmax(0, 1fr));
		gap: 1rem;
	}
	.status-card {
		display: flex;
		align-items: center;
		min-width: 0;
		padding: 1rem;
		border: 1px solid rgba(0, 0, 0, .05);
		border-radius: .375rem;
		box-shadow: 0 0 2rem 0 rgba(136, 152, 170, .15);
	}
	.status-icon {
		display: flex;
		align-items: center;
		justify-content: center;
		flex: 0 0 48px;
		height: 48px;
		margin-right: 1rem;
		border-radius: 50%;
		color: #fff;
		font-size: .75rem;
		font-weight: 700;
	}
	.status-icon.tcp { background: #2eb8ce; }
	.status-icon.udp { background: #f7ad39; }
	.status-icon.dns { background: #2f98e8; }
	.status-card h4 {
		margin: 0;
		color: #8898aa !important;
		font-size: .8125rem;
		font-weight: 600;
		line-height: 1.8em;
	}
	.green {
		color: #2dce89;
		font-size: .9rem;
	}
	.red {
		color: #fb6340;
		font-size: .9rem;
	}
	@media screen and (max-width: 720px) {
		.status-grid {
			grid-template-columns: 1fr;
			gap: .4rem;
		}
	}
</style>

<fieldset id="_passwall_status_fieldset" class="cbi-section">
	<legend><%:Running Status%></legend>
	<div class="status-grid">
		<div class="status-card">
			<div class="status-icon tcp">TCP</div>
			<h4 id="status_tcp_node">TCP<br /><span class="red"><%:NOT RUNNING%></span></h4>
		</div>
		<div class="status-card">
			<div class="status-icon udp">UDP</div>
			<h4 id="status_udp_node">UDP<br /><span class="red"><%:NOT RUNNING%></span></h4>
		</div>
		<div class="status-card">
			<div class="status-icon dns">DNS</div>
			<h4 id="status_dns">DNS<br /><span class="red"><%:NOT RUNNING%></span></h4>
		</div>
	</div>
	<script>
		//<![CDATA[
		function update_status(id, name, running) {
			var element = document.getElementById(id);
			if (element) {
				element.innerHTML = name + '<br /><span class="' + (running ? 'green' : 'red') + '">' +
					(running ? '<%:RUNNING%>' : '<%:NOT RUNNING%>') + '</span>';
			}
		}

		XHR.poll(5, '<%=api.url("index_status")%>', null, function (x, data) {
			if (data) {
				update_status('status_tcp_node', 'TCP', data.tcp_node_status);
				update_status('status_udp_node', 'UDP', data.udp_node_status);
				update_status('status_dns', 'DNS', data.dns_mode_status);
			}
		});
		//]]>
	</script>
</fieldset>
